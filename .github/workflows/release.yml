name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner: the build validates against /System/Library/DTDs/KeyboardLayout.dtd
    # and packages the bundle with ditto.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The diagrams are generated from the .keylayout and committed. Regenerate
      # them here: a mapping change that leaves a stale diagram behind fails the
      # build rather than shipping a README that lies about the layout.
      - name: Diagrams are current
        run: |
          python3 scripts/render.py src/*.keylayout docs/images
          if ! git diff --exit-code -- docs/images; then
            echo "::error::docs/images is stale — run scripts/render.py and commit the result"
            exit 1
          fi

      - name: Build
        id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          ./scripts/build.sh "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-layout
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
